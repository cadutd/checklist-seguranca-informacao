name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_BASE_PATH: /checklist-seguranca-informacao/
  VITE_MODO_DEMONSTRACAO: 'false'

jobs:
  validar:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Executar testes isolados
        run: npm test
      - name: Exigir configuração pública do Supabase
        if: github.event_name != 'pull_request'
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Configure VITE_SUPABASE_URL nas variáveis do repositório.'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'Configure VITE_SUPABASE_ANON_KEY nas variáveis do repositório.'; exit 1; }
      - name: Gerar build de produção
        run: npm run build
      - name: Conferir artefatos gerados
        run: node scripts/verificar-build.mjs
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Enviar artefato estático
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  publicar:
    name: Publicar aplicação
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verificar_producao:
    name: Conferir publicação e API
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter verificações
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verificar página, API e privacidade sem modificar diagnósticos
        run: node scripts/verificar-producao.mjs
